name: Daily forecast
on:
  schedule:
    - cron: "23 6 * * *"   # 06:23 UTC = 06:23 GMT / 07:23 BST, always after the 06:00 issue time
  workflow_dispatch:       # adds a "Run workflow" button for testing
permissions:
  contents: write
concurrency:
  group: forecast-repo-writes
  cancel-in-progress: false
jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run gridforecast ingest-recent --days 16
      - run: uv run gridforecast forecast
      - run: uv run gridforecast score
      - run: uv run gridforecast report   # NEW: rebuild docs/index.html
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forecasts/ reports/live_scores.parquet reports/live_summary.json docs/ data/raw/  # NEW: docs/
          git diff --cached --quiet || git commit -m "Forecast issued $(date -u +%F)"
          git pull --rebase
          git push