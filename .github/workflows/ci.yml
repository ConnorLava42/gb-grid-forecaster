name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen            # no --extra nn: PyTorch is too big for CI
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest --cov=gridforecast --cov-report=term-missing