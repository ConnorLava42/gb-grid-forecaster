[project]
name = "gridforecast"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ConnorLava42", email = "cjlavanaway@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "holidays>=0.108",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "mlflow>=3.18.0",
    "optuna>=5.0.0",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "pyarrow>=26.0.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "shap>=0.54.1",
    "tabulate>=0.10.0",
    "typer>=0.28.0",
]

[project.scripts]
gridforecast = "gridforecast.cli:app"

[project.optional-dependencies]
nn = [
    "torch>=2.15.0",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "responses>=0.26.3",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E731"]  # allow small lambdas, used for model factories

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["nn: needs the optional PyTorch extra"]